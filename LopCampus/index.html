    <script>
      // Gracefully prevent unhandled WebSocket closure error alerts from Vite in iframe/proxy environments
      window.addEventListener('error', function (event) {
        if (
          event?.message?.includes('WebSocket') ||
          event?.error?.message?.includes('WebSocket') ||
          (typeof event?.message === 'string' && event.message.includes('WebSocket closed'))
        ) {
          event.preventDefault?.();
          event.stopImmediatePropagation?.();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event?.reason?.message?.includes('WebSocket') ||
          (typeof event?.reason === 'string' && event.reason.includes('WebSocket'))
        ) {
          event.preventDefault?.();
          event.stopImmediatePropagation?.();
        }
      });
    </script>
